<script>
/**
 * SISTEMA DIGITAL DO LIVRO DE REGISTRO DE ATIVIDADES (CBM - PMESP)
 * Scripts.html - Gerenciador de estado, RPC cliente, validações e interações
 */

const App = (function() {
  const STATE = {
    token: null,
    user: null,
    initialData: null,
    currentRegistroId: null,
    currentRegistroData: null,
    activeView: 'view-dashboard',
    viaturasList: [],
    armamentosList: [],
    coletesList: [],
    municoesList: [],
    rondasList: []
  };

  /**
   * Chamador de RPC seguro (Compatível com google.script.run e dev_server local)
   */
  function rpc(functionName, ...args) {
    return new Promise((resolve, reject) => {
      // 1. Ambiente Google Apps Script Web App
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            resolve(res);
          })
          .withFailureHandler((err) => {
            reject(err);
          })[functionName](...args);
        return;
      }

      // 2. Ambiente de Desenvolvimento Local (Dev Server HTTP POST)
      fetch(`/api/${functionName}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(args)
      })
      .then(res => res.json())
      .then(data => resolve(data))
      .catch(err => reject(err));
    });
  }

  /**
   * Notificações Toast
   */
  function showToast(message, type = 'info', duration = 4000) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    
    let icon = 'ℹ️';
    if (type === 'success') icon = '✅';
    else if (type === 'error') icon = '❌';

    toast.innerHTML = `
      <div style="font-size: 1.2rem;">${icon}</div>
      <div style="flex: 1; font-size: 0.88rem;">${message}</div>
    `;

    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      toast.style.transition = 'all 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  function showLoading(show = true) {
    const el = document.getElementById('loading-overlay');
    if (el) el.style.display = show ? 'flex' : 'none';
  }

  function abrirModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  function fecharModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  }

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerText = '🔒 Ocultar';
    } else {
      input.type = 'password';
      btn.innerText = '👁️ Mostrar';
    }
  }

  /**
   * Navegação entre Visões
   */
  function navegarPara(viewId) {
    const views = ['view-dashboard', 'view-registro-form', 'view-consulta', 'view-admin'];
    views.forEach(v => {
      const el = document.getElementById(v);
      if (el) el.classList.remove('active');
    });

    const target = document.getElementById(viewId);
    if (target) {
      target.classList.add('active');
      STATE.activeView = viewId;
    }

    // Atualiza botões da navbar
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (viewId === 'view-dashboard') {
      const btn = document.getElementById('nav-btn-dashboard');
      if (btn) btn.classList.add('active');
      carregarDashboard();
    } else if (viewId === 'view-consulta') {
      const btn = document.getElementById('nav-btn-consulta');
      if (btn) btn.classList.add('active');
      executarPesquisaConsulta(1);
    } else if (viewId === 'view-admin') {
      const btn = document.getElementById('nav-btn-admin');
      if (btn) btn.classList.add('active');
      abrirAdminSubTab('militares');
    }
  }

  /**
   * Inicialização da Aplicação
   */
  async function init() {
    // Verifica se há token salvo no sessionStorage
    const savedToken = sessionStorage.getItem('cbm_session_token');
    const savedUserJson = sessionStorage.getItem('cbm_session_user');

    if (savedToken && savedUserJson) {
      try {
        STATE.token = savedToken;
        STATE.user = JSON.parse(savedUserJson);
        await carregarDadosIniciais();
        aplicarSessaoAutenticada();
        return;
      } catch (e) {
        sessionStorage.clear();
      }
    }

    // Caso não autenticado, garante tela de login visível
    document.getElementById('login-screen').style.display = 'flex';
  }

  /**
   * Login Operacional
   */
  async function fazerLogin() {
    const reInput = document.getElementById('login-re');
    const senhaInput = document.getElementById('login-senha');
    const errorBox = document.getElementById('login-error-alert');
    const submitBtn = document.getElementById('btn-login-submit');

    errorBox.style.display = 'none';

    const username = reInput.value.trim();
    const password = senhaInput.value.trim();

    if (!username || !password) {
      errorBox.innerText = 'Preencha seu RE e sua senha de acesso.';
      errorBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'Verificando...';

    try {
      const res = await rpc('apiLogin', username, password);

      if (!res.success) {
        errorBox.innerText = res.message || 'Falha de autenticação.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Entrar no Sistema';
        return;
      }

      STATE.token = res.token;
      STATE.user = res.user;

      sessionStorage.setItem('cbm_session_token', STATE.token);
      sessionStorage.setItem('cbm_session_user', JSON.stringify(STATE.user));

      await carregarDadosIniciais();
      aplicarSessaoAutenticada();

      // Verifica troca obrigatória de senha
      if (res.user.forcar_troca_senha) {
        abrirModal('modal-troca-senha');
      }
    } catch (err) {
      errorBox.innerText = 'Erro de comunicação: ' + (err.message || err);
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Entrar no Sistema';
    }
  }

  /**
   * Logout
   */
  async function fazerLogout() {
    try {
      if (STATE.token) {
        await rpc('apiLogout', STATE.token);
      }
    } catch (e) {}

    sessionStorage.clear();
    STATE.token = null;
    STATE.user = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('login-senha').value = '';
    showToast('Você saiu do sistema.', 'info');
  }

  /**
   * Troca obrigatória de senha
   */
  async function salvarTrocaSenha() {
    const atual = document.getElementById('troca-senha-atual').value;
    const nova = document.getElementById('troca-senha-nova').value;
    const confirma = document.getElementById('troca-senha-confirma').value;
    const errBox = document.getElementById('troca-senha-error');

    errBox.style.display = 'none';

    if (nova.length < 4) {
      errBox.innerText = 'A nova senha deve possuir pelo menos 4 caracteres.';
      errBox.style.display = 'block';
      return;
    }

    if (nova !== confirma) {
      errBox.innerText = 'A confirmação não coincide com a nova senha.';
      errBox.style.display = 'block';
      return;
    }

    showLoading(true);
    try {
      const res = await rpc('apiChangePassword', STATE.token, atual, nova, confirma);
      if (!res.success) {
        errBox.innerText = res.message;
        errBox.style.display = 'block';
        return;
      }

      fecharModal('modal-troca-senha');
      STATE.user.forcar_troca_senha = false;
      sessionStorage.setItem('cbm_session_user', JSON.stringify(STATE.user));
      showToast('Senha alterada com sucesso! Bem-vindo ao sistema.', 'success');
    } catch (e) {
      errBox.innerText = 'Falha ao alterar senha: ' + (e.message || e);
      errBox.style.display = 'block';
    } finally {
      showLoading(false);
    }
  }

  /**
   * Carrega metadados iniciais (Grupamentos, SGBs, Postos, Graduações)
   */
  async function carregarDadosIniciais() {
    const res = await rpc('apiGetInitialData', STATE.token);
    if (res.success) {
      STATE.initialData = res;
      popularSelectsGrupamentoEPosto(res);
    }
  }

  function popularSelectsGrupamentoEPosto(data) {
    // Select de Grupamento no formulário
    const selGb = document.getElementById('reg-grupamento');
    const selGbModal = document.getElementById('modal-pb-gb');
    if (selGb && data.grupamentos) {
      selGb.innerHTML = '';
      if (selGbModal) selGbModal.innerHTML = '';
      data.grupamentos.forEach(gb => {
        const opt = document.createElement('option');
        opt.value = gb.id;
        opt.innerText = gb.nome;
        if (gb.id === 'gb_15') opt.selected = true;
        selGb.appendChild(opt);

        if (selGbModal) {
          const opt2 = opt.cloneNode(true);
          selGbModal.appendChild(opt2);
        }
      });
    }

    // Select de Graduações no Modal de Militar
    const selGrad = document.getElementById('modal-mil-graduacao');
    if (selGrad && data.graduacoes) {
      selGrad.innerHTML = '';
      data.graduacoes.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.innerText = g;
        selGrad.appendChild(opt);
      });
    }

    // Popula PBs conforme SGB selecionado
    atualizarSelectPostos();
  }

  function atualizarSelectPostos() {
    const sgb = document.getElementById('reg-sgb').value;
    const selPb = document.getElementById('reg-pb');
    const filtroPb = document.getElementById('filtro-pb');

    if (!STATE.initialData || !STATE.initialData.postos) return;

    if (selPb) {
      selPb.innerHTML = '';
      const filtrados = STATE.initialData.postos.filter(p => p.sgb === sgb);
      filtrados.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = p.nome;
        selPb.appendChild(opt);
      });
    }

    if (filtroPb) {
      filtroPb.innerHTML = '<option value="">Todos os Postos</option>';
      STATE.initialData.postos.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = `${p.sigla} (${p.sgb})`;
        filtroPb.appendChild(opt);
      });
    }
  }

  function onSgbChange() {
    atualizarSelectPostos();
  }

  function onGrupamentoChange() {
    const selGb = document.getElementById('reg-grupamento');
    const disp = document.getElementById('header-grupamento-display');
    if (selGb && disp) {
      disp.innerText = selGb.options[selGb.selectedIndex].text.toUpperCase();
    }
  }

  function aplicarSessaoAutenticada() {
    document.getElementById('login-screen').style.display = 'none';

    // Atualiza cabeçalho do usuário
    const u = STATE.user;
    document.getElementById('header-user-re').innerText = u.re;
    document.getElementById('header-user-nome').innerText = u.nome_completo;

    const tag = document.getElementById('header-user-role-tag');
    tag.innerText = u.perfil.toUpperCase();
    tag.className = `user-role-tag role-${u.perfil}`;

    // Exibe ou oculta aba administrativa
    const navAdmin = document.getElementById('nav-btn-admin');
    if (navAdmin) {
      navAdmin.style.display = u.perfil === 'admin' ? 'inline-flex' : 'none';
    }

    navegarPara('view-dashboard');
  }

  /**
   * Cálculo de término 24h e Prontidão
   */
  async function onDataInicioChange() {
    const dataInicio = document.getElementById('reg-data-inicio').value;
    const horaInicio = document.getElementById('reg-hora-inicio').value || '07:30';

    if (!dataInicio) return;

    try {
      const res = await rpc('apiCalculateProntidao', dataInicio, horaInicio);
      if (res.success && res.data) {
        document.getElementById('reg-data-termino').value = res.data.data_termino;
        document.getElementById('reg-hora-termino').value = res.data.hora_termino;
        
        const selPront = document.getElementById('reg-prontidao-select');
        selPront.value = res.data.prontidao;
        atualizarBadgeProntidao(res.data.prontidao);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function onProntidaoManualChange() {
    const p = document.getElementById('reg-prontidao-select').value;
    atualizarBadgeProntidao(p);
  }

  function atualizarBadgeProntidao(cor) {
    const badge = document.getElementById('reg-badge-prontidao');
    if (!badge) return;
    badge.innerText = `Prontidão ${cor}`;
    badge.className = `badge-prontidao badge-prontidao-${cor.toLowerCase()}`;
  }

  /**
   * Busca Autocomplete Comandante de Prontidão por RE
   */
  async function buscarComandanteAutocomplete(query) {
    const container = document.getElementById('autocomplete-cmt-results');
    if (!query || query.trim().length < 2) {
      container.style.display = 'none';
      return;
    }

    try {
      const res = await rpc('apiSearchMilitares', query);
      if (res.success && res.results.length > 0) {
        container.innerHTML = '';
        res.results.forEach(m => {
          const item = document.createElement('div');
          item.className = 'autocomplete-item';
          item.innerText = m.display_formatado;
          item.onclick = () => {
            document.getElementById('reg-cmt-re').value = m.re;
            document.getElementById('reg-cmt-display').value = m.display_formatado;
            document.getElementById('reg-cmt-graduacao').value = m.graduacao;
            document.getElementById('reg-cmt-nome').value = m.nome_completo;
            container.style.display = 'none';
          };
          container.appendChild(item);
        });
        container.style.display = 'block';
      } else {
        container.style.display = 'none';
      }
    } catch (e) {
      container.style.display = 'none';
    }
  }

  /**
   * Busca rápida de instrutores
   */
  /**
   * Busca rápida de instrutores (formatação com espaços, sem hífens)
   */
  async function buscarInstrutorSec7(re) {
    if (re.length >= 4) {
      const res = await rpc('apiFindMilitarByRE', re);
      if (res.success && res.militar) {
        document.getElementById('sec7-instrutor-nome').value = `${res.militar.graduacao} ${res.militar.re_formatado} ${res.militar.nome_completo}`.trim();
      }
    }
  }

  async function buscarInstrutorSec8(re) {
    if (re.length >= 4) {
      const res = await rpc('apiFindMilitarByRE', re);
      if (res.success && res.militar) {
        document.getElementById('sec8-instrutor-nome').value = `${res.militar.graduacao} ${res.militar.re_formatado} ${res.militar.nome_completo}`.trim();
      }
    }
  }

  async function buscarInstrutorSec9(re) {
    if (re.length >= 4) {
      const res = await rpc('apiFindMilitarByRE', re);
      if (res.success && res.militar) {
        document.getElementById('sec9-instrutor-nome').value = `${res.militar.graduacao} ${res.militar.re_formatado} ${res.militar.nome_completo}`.trim();
      }
    }
  }

  function toggleAccordion(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active');
  }

  // ========================================================================
  // SEÇÃO 1: NOVIDADE DE PESSOAL (AUTOSSOMA VIA COMPLEMENTO)
  // ========================================================================
  STATE.complementosList = [];

  async function buscarMilitarComplemento(query) {
    const container = document.getElementById('autocomplete-comp-results');
    if (!query || query.trim().length < 2) {
      container.style.display = 'none';
      return;
    }

    try {
      const res = await rpc('apiSearchMilitares', query);
      if (res.success && res.results.length > 0) {
        container.innerHTML = '';
        res.results.forEach(m => {
          const item = document.createElement('div');
          item.className = 'autocomplete-item';
          item.innerText = m.display_formatado;
          item.onclick = () => {
            document.getElementById('comp-re').value = m.re;
            // Seleciona a graduação no select oficial
            const selGrad = document.getElementById('comp-graduacao');
            for (let i = 0; i < selGrad.options.length; i++) {
              if (selGrad.options[i].value.toUpperCase() === String(m.graduacao || '').trim().toUpperCase() ||
                  selGrad.options[i].text.toUpperCase().includes(String(m.graduacao || '').trim().toUpperCase())) {
                selGrad.selectedIndex = i;
                break;
              }
            }
            document.getElementById('comp-nome').value = m.nome_completo;
            container.style.display = 'none';
          };
          container.appendChild(item);
        });
        container.style.display = 'block';
      } else {
        container.style.display = 'none';
      }
    } catch (e) {
      container.style.display = 'none';
    }
  }

  function incluirComplemento() {
    const categoria = document.getElementById('comp-categoria').value;
    const re = document.getElementById('comp-re').value.trim();
    const graduacao = document.getElementById('comp-graduacao').value;
    const nome = document.getElementById('comp-nome').value.trim();
    const motivo = document.getElementById('comp-motivo').value.trim();

    if (!re) {
      showToast('Informe o RE do militar para o complemento.', 'error');
      return;
    }
    if (!nome) {
      showToast('Informe o nome do militar.', 'error');
      return;
    }

    STATE.complementosList.push({
      id: 'c_' + Date.now(),
      categoria: categoria,
      militar_re: re,
      militar_graduacao: graduacao,
      militar_nome: nome,
      motivo: motivo,
      display_formatado: `${graduacao} ${re} ${nome}`
    });

    renderComplementosLista();
    atualizarAutossomaPessoal();

    // Limpa campos
    document.getElementById('comp-re').value = '';
    document.getElementById('comp-nome').value = '';
    document.getElementById('comp-motivo').value = '';
  }

  function removerComplemento(idx) {
    STATE.complementosList.splice(idx, 1);
    renderComplementosLista();
    atualizarAutossomaPessoal();
  }

  function renderComplementosLista() {
    const container = document.getElementById('container-complementos-lista');
    if (!container) return;

    if (!STATE.complementosList || STATE.complementosList.length === 0) {
      container.innerHTML = '<p style="font-size: 0.8rem; color: var(--text-muted); font-style: italic;">Nenhum complemento lançado no serviço atual.</p>';
      return;
    }

    let html = '';
    STATE.complementosList.forEach((c, idx) => {
      html += `
        <div class="complemento-item-card">
          <div class="complemento-item-info">
            <div>
              <span class="status-badge" style="background: rgba(239, 68, 68, 0.15); color: #f87171; font-weight: 700; margin-right: 0.5rem;">${c.categoria}</span>
              <strong style="color: #fff;">${c.militar_graduacao} ${c.militar_re} ${c.militar_nome}</strong>
            </div>
            ${c.motivo ? `<div style="color: var(--text-secondary); font-size: 0.78rem;">📝 Motivo: ${c.motivo}</div>` : ''}
          </div>
          <button type="button" class="btn btn-danger btn-sm" onclick="App.removerComplemento(${idx})">Remover</button>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function atualizarAutossomaPessoal() {
    let falta = 0, baixas = 0, visitantes = 0, licenca = 0, restricao = 0, estagiarios = 0;

    STATE.complementosList.forEach(c => {
      const cat = String(c.categoria || '').trim().toLowerCase();
      if (cat === 'falta') falta++;
      else if (cat === 'baixas' || cat === 'baixa') baixas++;
      else if (cat === 'visitantes' || cat === 'visitante') visitantes++;
      else if (cat.includes('licença') || cat.includes('convalescença') || cat.includes('licenca')) licenca++;
      else if (cat.includes('restrição') || cat.includes('restricao')) restricao++;
      else if (cat.includes('estagiário') || cat.includes('estagiario') || cat.includes('estagiários')) estagiarios++;
    });

    const updateCard = (idVal, idCard, count) => {
      const elVal = document.getElementById(idVal);
      const elCard = document.getElementById(idCard);
      if (elVal) elVal.innerText = count;
      if (elCard) {
        if (count > 0) elCard.classList.add('active-count');
        else elCard.classList.remove('active-count');
      }
    };

    updateCard('sec1-falta-val', 'card-cnt-falta', falta);
    updateCard('sec1-baixas-val', 'card-cnt-baixas', baixas);
    updateCard('sec1-visitantes-val', 'card-cnt-visitantes', visitantes);
    updateCard('sec1-licenca-val', 'card-cnt-licenca', licenca);
    updateCard('sec1-restricao-val', 'card-cnt-restricao', restricao);
    updateCard('sec1-estagiarios-val', 'card-cnt-estagiarios', estagiarios);
  }

  // ========================================================================
  // SEÇÃO 2: MATERIAL BÉLICO (CATÁLOGO REUTILIZÁVEL)
  // ========================================================================
  STATE.catalogoMateriais = [];

  async function carregarCatalogoMateriais(itensMarcados = null) {
    const tbody = document.getElementById('tbody-catalogo-materiais');
    if (!tbody) return;

    try {
      let lista = STATE.initialData && STATE.initialData.catalogoMateriais ? STATE.initialData.catalogoMateriais : [];
      if (!lista || lista.length === 0) {
        const res = await rpc('apiGetCatalogoMateriais', STATE.token);
        if (res.success && res.catalogo) lista = res.catalogo;
      }
      STATE.catalogoMateriais = lista;

      tbody.innerHTML = '';
      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 1rem;">Nenhum material no catálogo. Cadastre no botão acima.</td></tr>';
        return;
      }

      lista.forEach((item, idx) => {
        const tr = document.createElement('tr');
        tr.className = 'catalogo-row';
        tr.dataset.itemId = item.id;
        tr.dataset.categoria = item.categoria;

        const isChecked = itensMarcados ? itensMarcados.some(m => m.tipo === item.tipo || m.numero_serie === item.numero_serie) : true;
        const catBadgeColor = item.categoria === 'armamento' ? '#ef4444' : (item.categoria === 'colete' ? '#3b82f6' : '#10b981');

        tr.innerHTML = `
          <td style="text-align: center;">
            <input type="checkbox" class="cat-check" ${isChecked ? 'checked' : ''}>
          </td>
          <td><span class="status-badge" style="background: rgba(255,255,255,0.08); color: ${catBadgeColor}; text-transform: uppercase;">${item.categoria}</span></td>
          <td><strong>${item.tipo}</strong> ${item.modelo_tamanho ? `(${item.modelo_tamanho})` : ''}</td>
          <td>${item.marca_capas || '-'}</td>
          <td><code>${item.numero_serie || 'N/A'}</code></td>
          <td style="text-align: center;">
            <input type="number" min="0" class="form-input cat-qtd" style="max-width: 70px; text-align: center; padding: 2px 4px;" value="${item.quantidade_padrao || 1}">
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (e) {
      console.error(e);
    }
  }

  function abrirModalCatalogoMaterial() {
    abrirModal('modal-catalogo-material');
  }

  async function salvarMaterialCatalogoModal() {
    const categoria = document.getElementById('cat-material-categoria').value;

  async function carregarViaturasDaFrota(pbId = null, sgb = null) {
    const container = document.getElementById('container-viaturas');
    if (!container) return;

    try {
      let frotas = STATE.initialData && STATE.initialData.viaturasFrota ? STATE.initialData.viaturasFrota : [];
      if (!frotas || frotas.length === 0) {
        const res = await rpc('apiListViaturasFrota', sgb, pbId, STATE.token);
        if (res.success && res.viaturas) frotas = res.viaturas;
      }

      container.innerHTML = '';
      STATE.viaturasCards = [];

      frotas.forEach(v => {
        adicionarCardViatura({
          prefixo: v.prefixo,
          situacao: v.status || 'Operando',
          estacao: v.estacao || '',
          km: v.km || '',
          observacoes: v.km ? `KM: ${v.km}` : '',
          comandante_re: '',
          comandante_nome: '',
          motorista_re: '',
          motorista_nome: '',
          auxiliares: []
        });
      });
      atualizarTotaisViaturas();
    } catch (e) {
      console.error(e);
    }
  }

  async function buscarMilitarGuarnicao(input, role, vtrIdx, auxIdx = null) {
    const query = input.value.trim();
    const dropdownId = role === 'aux' ? `autocomplete-vtr-aux-${vtrIdx}-${auxIdx}` : (role === 'cmt' ? `autocomplete-vtr-cmt-${vtrIdx}` : `autocomplete-vtr-mot-${vtrIdx}`);
    const dropdown = document.getElementById(dropdownId);
    if (!dropdown) return;

    if (query.length < 2) {
      dropdown.style.display = 'none';
      return;
    }

    try {
      const res = await rpc('apiSearchMilitares', query);
      if (res.success && res.results.length > 0) {
        dropdown.innerHTML = '';
        res.results.forEach(m => {
          const item = document.createElement('div');
          item.className = 'autocomplete-item';
          item.innerText = m.display_formatado;
          item.onclick = () => {
            const vData = STATE.viaturasCards[vtrIdx];
            if (role === 'cmt') {
              input.value = m.re;
              input.parentElement.querySelector('.vtr-cmt-nome').value = m.display_formatado;
              if (vData) {
                vData.comandante_re = m.re;
                vData.comandante_nome = m.display_formatado;
              }
            } else if (role === 'mot') {
              input.value = m.re;
              input.parentElement.querySelector('.vtr-mot-nome').value = m.display_formatado;
              if (vData) {
                vData.motorista_re = m.re;
                vData.motorista_nome = m.display_formatado;
              }
            } else if (role === 'aux' && auxIdx !== null) {
              input.value = m.re;
              input.parentElement.querySelector('input:nth-child(2)').value = m.display_formatado;
              if (vData && vData.auxiliares[auxIdx]) {
                vData.auxiliares[auxIdx].re = m.re;
                vData.auxiliares[auxIdx].nome = m.nome_completo;
                vData.auxiliares[auxIdx].display = m.display_formatado;
              }
            }
            dropdown.style.display = 'none';
          };
          dropdown.appendChild(item);
        });
        dropdown.style.display = 'block';
      } else {
        dropdown.style.display = 'none';
      }
    } catch (e) {
      dropdown.style.display = 'none';
    }
  }

  function atualizarTotaisViaturas() {
    let op = 0, bx = 0, res = 0, ac = 0;
    STATE.viaturasCards.forEach(v => {
      if (!v) return;
      const sit = v.situacao || 'Operando';
      if (sit === 'Operando') op++;
      else if (sit === 'Baixada') bx++;
      else if (sit === 'Reserva') res++;
      else if (sit === 'Acidentada') ac++;
    });

    const elOp = document.getElementById('total-vtr-operando');
    const elBx = document.getElementById('total-vtr-baixada');
    const elRes = document.getElementById('total-vtr-reserva');
    const elAc = document.getElementById('total-vtr-acidentada');

    if (elOp) elOp.innerText = op;
    if (elBx) elBx.innerText = bx;
    if (elRes) elRes.innerText = res;
    if (elAc) elAc.innerText = ac;
  }

    document.getElementById('reg-data-termino').value = h.data_termino;
    document.getElementById('reg-hora-termino').value = h.hora_termino;

    document.getElementById('reg-prontidao-select').value = h.prontidao;
    atualizarBadgeProntidao(h.prontidao);

    document.getElementById('reg-cmt-re').value = h.cmt_re;
    document.getElementById('reg-cmt-display').value = `${h.cmt_graduacao} ${h.cmt_re} ${h.cmt_nome}`;
    document.getElementById('reg-cmt-graduacao').value = h.cmt_graduacao;
    document.getElementById('reg-cmt-nome').value = h.cmt_nome;

    // Status Badge
    const stBadge = document.getElementById('badge-registro-status');
    stBadge.innerText = h.status;
    stBadge.className = `status-badge badge-${h.status.toLowerCase().replace(/\s+/g, '-')}`;

    // Seção 1: Novidade de Pessoal com Complementos e Autossoma
    const p = data.pessoal || {};
    document.getElementById('sec1-complemento').value = p.complemento || '';
    STATE.complementosList = (p.complementos && Array.isArray(p.complementos)) ? p.complementos : [];
    renderComplementosLista();
    atualizarAutossomaPessoal();
    if (STATE.complementosList.length === 0) {
      document.getElementById('sec1-falta-val').innerText = p.falta || 0;
      document.getElementById('sec1-baixas-val').innerText = p.baixas || 0;
      document.getElementById('sec1-visitantes-val').innerText = p.visitantes || 0;
      document.getElementById('sec1-licenca-val').innerText = p.licenca_convalescenca || 0;
      document.getElementById('sec1-restricao-val').innerText = p.restricao || 0;
      document.getElementById('sec1-estagiarios-val').innerText = p.estagiarios || 0;
    }

    // Seção 2: Material Bélico via Catálogo Permanente
    let belicosMarcados = [];
    if (data.materiais_belicos) {
      if (data.materiais_belicos.armamentos) belicosMarcados.push(...data.materiais_belicos.armamentos);
      if (data.materiais_belicos.coletes) belicosMarcados.push(...data.materiais_belicos.coletes);
      if (data.materiais_belicos.municoes) belicosMarcados.push(...data.materiais_belicos.municoes);
    }
    carregarCatalogoMateriais(belicosMarcados.length > 0 ? belicosMarcados : null);
    document.getElementById('sec2-outros').value = (data.materiais_belicos && data.materiais_belicos.outros_materiais) || '';

    // Seção 3
    document.getElementById('sec3-novidade').value = (data.novidades_materiais && data.novidades_materiais.descricao) || data.novidades_materiais || '';

    // Seção 4: Situação de Viaturas com Guarnição
    const containerVtr = document.getElementById('container-viaturas');
    containerVtr.innerHTML = '';
    STATE.viaturasCards = [];
    if (data.viaturas && Array.isArray(data.viaturas.viaturas) && data.viaturas.viaturas.length > 0) {
      data.viaturas.viaturas.forEach(v => adicionarCardViatura(v));
    } else {
      carregarViaturasDaFrota(h.pb_id, h.sgb);
    }
    atualizarTotaisViaturas();

    // Seção 5 e 6
    document.getElementById('sec5-ordem-dia').value = data.ordem_dia || '';
    document.getElementById('sec6-verbais').value = (data.ordens_recebidas && data.ordens_recebidas.verbais) || '';
    document.getElementById('sec6-escritas').value = (data.ordens_recebidas && data.ordens_recebidas.escritas) || '';

    // Seções 7, 8, 9
    const t = data.treinamentos;
    if (t) {
      if (t.armar_geral) {
        document.getElementById('sec7-treinamento').value = t.armar_geral.treinamento_executado || '';
        document.getElementById('sec7-pops').value = t.armar_geral.pops_normas || '';
        document.getElementById('sec7-instrutor-re').value = t.armar_geral.instrutor_re || '';
        document.getElementById('sec7-instrutor-nome').value = t.armar_geral.instrutor_nome || '';
        document.getElementById('sec7-participantes').value = t.armar_geral.participantes_nomes || t.armar_geral.participantes_res || '';
        document.getElementById('sec7-materiais').value = t.armar_geral.materiais_utilizados || '';
        document.getElementById('sec7-observacoes').value = t.armar_geral.observacoes || '';
      }
      if (t.instrucao) {
        document.getElementById('sec8-assunto').value = t.instrucao.assunto || '';
        document.getElementById('sec8-instrutor-re').value = t.instrucao.instrutor_re || '';
        document.getElementById('sec8-instrutor-nome').value = t.instrucao.instrutor_nome || '';
        document.getElementById('sec8-participantes').value = t.instrucao.participantes_nomes || t.instrucao.participantes_res || '';
        document.getElementById('sec8-literatura').value = t.instrucao.literatura_tecnica || '';
        document.getElementById('sec8-observacoes').value = t.instrucao.observacoes || '';
      }
      if (t.treinamento_fisico) {
        document.getElementById('sec9-atividades').value = t.treinamento_fisico.atividades_realizadas || '';
        document.getElementById('sec9-instrutor-re').value = t.treinamento_fisico.instrutor_re || '';
        document.getElementById('sec9-instrutor-nome').value = t.treinamento_fisico.instrutor_nome || '';
        document.getElementById('sec9-observacoes').value = t.treinamento_fisico.observacoes || '';
      }
    }

    // Seção 10, 11
    if (data.manutencao) {
      document.getElementById('sec10-limpeza').value = data.manutencao.limpeza || '';
      document.getElementById('sec10-melhoria').value = data.manutencao.melhoria || '';
      document.getElementById('sec10-energia').value = data.manutencao.medidor_energia || '';
      document.getElementById('sec10-hidrometro').value = data.manutencao.hidrometro || '';
    }
    document.getElementById('sec11-ocorrencias').value = data.ocorrencias || '';

    // Seção 12
    document.getElementById('container-rondas').innerHTML = '';
    if (data.rondas && data.rondas.length > 0) {
      data.rondas.forEach(r => adicionarRonda(r.ordem, r.funcao, r.posto, r.data_hora, r.responsavel_re, r.responsavel_nome, r.novidades_sugestoes));
    }

    // Conferências
    renderConferencias(data.conferencias);

    // Botão Finalizar
    const btnFin = document.getElementById('btn-finalizar-registro');
    if (h.status === 'Conferido' || STATE.user.perfil === 'admin') {
      btnFin.style.display = h.status === 'Finalizado' ? 'none' : 'inline-flex';
    } else {
      btnFin.style.display = 'none';
    }
  }

  function renderConferencias(confs) {
    const boxSai = document.getElementById('box-conf-cmt-sai');
    const boxEntra = document.getElementById('box-conf-cmt-entra');
    const boxPb = document.getElementById('box-conf-cmt-pb');

    const btnSai = document.getElementById('btn-conf-sai');
    const btnEntra = document.getElementById('btn-conf-entra');
    const btnPb = document.getElementById('btn-conf-pb');

    function fillBlock(box, btn, conf, tagId, gradId, reId, nomeId, dataId) {
      if (conf) {
        box.classList.add('conferido');
        document.getElementById(tagId).innerHTML = '<span class="status-badge badge-finalizado">Assinado / Visto</span>';
        document.getElementById(gradId).innerText = conf.autoridade_graduacao || '-';
        document.getElementById(reId).innerText = conf.autoridade_re || '-';
        document.getElementById(nomeId).innerText = conf.autoridade_nome || '-';
        document.getElementById(dataId).innerText = 'Data/Hora: ' + new Date(conf.data_hora).toLocaleString('pt-BR');
        btn.innerText = '✔️ Assinado';
        btn.disabled = true;
      } else {
        box.classList.remove('conferido');
        document.getElementById(tagId).innerHTML = '<span class="status-badge badge-rascunho">Pendente</span>';
        document.getElementById(gradId).innerText = '-';
        document.getElementById(reId).innerText = '-';
        document.getElementById(nomeId).innerText = '-';
        document.getElementById(dataId).innerText = 'Data/Hora: Não assinado';
        btn.innerText = 'Assinar Eletronicamente';
        btn.disabled = false;
      }
    }

    fillBlock(boxSai, btnSai, confs ? confs.cmt_sai : null, 'tag-conf-cmt-sai', 'conf-sai-grad', 'conf-sai-re', 'conf-sai-nome', 'conf-sai-data');
    fillBlock(boxEntra, btnEntra, confs ? confs.cmt_entra : null, 'tag-conf-cmt-entra', 'conf-entra-grad', 'conf-entra-re', 'conf-entra-nome', 'conf-entra-data');
    fillBlock(boxPb, btnPb, confs ? confs.cmt_pb : null, 'tag-conf-cmt-pb', 'conf-pb-grad', 'conf-pb-re', 'conf-pb-nome', 'conf-pb-data');
  }

  /**
   * Salvar Registro (Rascunho ou Gravação Completa)
   */
  async function salvarRegistroForm(isDraft = false) {
    const dataInicio = document.getElementById('reg-data-inicio').value;
    const sgb = document.getElementById('reg-sgb').value;
    const pbId = document.getElementById('reg-pb').value;
    const cmtRe = document.getElementById('reg-cmt-re').value;

    if (!dataInicio || !sgb || !pbId) {
      showToast('Preencha os campos obrigatórios do cabeçalho (Data, SGB e PB).', 'error');
      return;
    }

    showLoading(true);
    document.getElementById('form-save-indicator').innerText = 'Salvando no banco de dados...';

    try {
      let regId = STATE.currentRegistroId;

      // 1. Se for novo registro, cria primeiro no backend
      if (!regId) {
        const createRes = await rpc('apiCreateRegistro', {
          data_inicio: dataInicio,
          hora_inicio: document.getElementById('reg-hora-inicio').value || '07:30',
          sgb: sgb,
          pb_id: pbId,
          cmt_re: cmtRe,
          isDraft: isDraft
        }, STATE.token);

        if (!createRes.success) {
          if (createRes.isDuplicate) {
            if (confirm(createRes.message)) {
              await carregarRegistroPorId(createRes.existingId);
            }
            return;
          }
          showToast(createRes.message, 'error');
          return;
        }

        regId = createRes.registro.id;
        STATE.currentRegistroId = regId;
        document.getElementById('reg-id').value = regId;
        document.getElementById('reg-numero').value = createRes.registro.numero_registro;
        document.getElementById('form-titulo').innerText = `Livro de Registro: ${createRes.registro.numero_registro}`;
      }

      // 2. Coleta dados de todas as seções
      // 2.1 Material Bélico via Catálogo Selecionado
      const armamentos = [];
      const coletes = [];
      const municoes = [];
      document.querySelectorAll('.catalogo-row').forEach(row => {
        const chk = row.querySelector('.cat-check');
        if (chk && chk.checked) {
          const itemId = row.dataset.itemId;
          const cat = row.dataset.categoria;
          const qtd = parseInt(row.querySelector('.cat-qtd').value, 10) || 1;
          const itemDef = (STATE.catalogoMateriais || []).find(c => String(c.id) === String(itemId));
          if (itemDef) {
            if (cat === 'armamento') {
              armamentos.push({
                tipo: itemDef.tipo,
                modelo: itemDef.modelo_tamanho,
                marca: itemDef.marca_capas,
                numero_serie: itemDef.numero_serie,
                quantidade: qtd
              });
            } else if (cat === 'colete') {
              coletes.push({
                tamanho: itemDef.modelo_tamanho,
                quantidade: qtd,
                capas: itemDef.marca_capas,
                numero_serie: itemDef.numero_serie
              });
            } else if (cat === 'municao') {
              municoes.push({
                tipo: itemDef.tipo,
                quantidade: qtd
              });
            }
          }
        }
      });

      // 2.2 Viaturas com Guarnição
      const viaturas = (STATE.viaturasCards || []).filter(v => v && v.prefixo).map(v => ({
        prefixo: v.prefixo,
        situacao: v.situacao || 'Operando',
        observacoes: v.observacoes || '',
        comandante_re: v.comandante_re || '',
        comandante_nome: v.comandante_nome || '',
        motorista_re: v.motorista_re || '',
        motorista_nome: v.motorista_nome || '',
        auxiliares: Array.isArray(v.auxiliares) ? v.auxiliares : []
      }));

      // 2.3 Rondas
      const rondas = [];
      document.querySelectorAll('.ronda-item').forEach((card, idx) => {
        rondas.push({
          ordem: idx + 1,
          funcao: card.querySelector('.r-funcao').value,
          posto: card.querySelector('.r-posto').value,
          data_hora: card.querySelector('.r-hora').value,
          responsavel_re: card.querySelector('.r-re').value,
          responsavel_nome: card.querySelector('.r-nome').value,
          novidades_sugestoes: card.querySelector('.r-novidades').value
        });
      });

      const payload = {
        header: {
          cmt_re: cmtRe,
          status: isDraft ? 'Rascunho' : 'Em preenchimento'
        },
        pessoal: {
          falta: parseInt(document.getElementById('sec1-falta-val').innerText, 10) || 0,
          baixas: parseInt(document.getElementById('sec1-baixas-val').innerText, 10) || 0,
          visitantes: parseInt(document.getElementById('sec1-visitantes-val').innerText, 10) || 0,
          licenca_convalescenca: parseInt(document.getElementById('sec1-licenca-val').innerText, 10) || 0,
          restricao: parseInt(document.getElementById('sec1-restricao-val').innerText, 10) || 0,
          estagiarios: parseInt(document.getElementById('sec1-estagiarios-val').innerText, 10) || 0,
          complemento: document.getElementById('sec1-complemento').value,
          complementos: STATE.complementosList || []
        },
        materiais_belicos: {
          armamentos: armamentos,
          coletes: coletes,
          municoes: municoes,
          outros_materiais: document.getElementById('sec2-outros').value
        },
        novidades_materiais: {
          descricao: document.getElementById('sec3-novidade').value
        },
        viaturas: viaturas,
        conferencias: {
          cmt_sai_re: (document.getElementById('conf-input-sai-re') && document.getElementById('conf-input-sai-re').value.trim()) || '',
          cmt_entra_re: (document.getElementById('conf-input-entra-re') && document.getElementById('conf-input-entra-re').value.trim()) || (STATE.user && STATE.user.re) || '',
          cmt_pb_re: (document.getElementById('conf-input-pb-re') && document.getElementById('conf-input-pb-re').value.trim()) || ''
        },
        ordem_dia: document.getElementById('sec5-ordem-dia').value,
        ordens_recebidas: {
          verbais: document.getElementById('sec6-verbais').value,
          escritas: document.getElementById('sec6-escritas').value
        },
        treinamentos: {
          armar_geral: {
            treinamento_executado: document.getElementById('sec7-treinamento').value,
            pops_normas: document.getElementById('sec7-pops').value,
            instrutor_re: document.getElementById('sec7-instrutor-re').value,
            instrutor_nome: document.getElementById('sec7-instrutor-nome').value,
            participantes_nomes: document.getElementById('sec7-participantes').value,
            materiais_utilizados: document.getElementById('sec7-materiais').value,
            observacoes: document.getElementById('sec7-observacoes').value
          },
          instrucao: {
            assunto: document.getElementById('sec8-assunto').value,
            instrutor_re: document.getElementById('sec8-instrutor-re').value,
            instrutor_nome: document.getElementById('sec8-instrutor-nome').value,
            participantes_nomes: document.getElementById('sec8-participantes').value,
            literatura_tecnica: document.getElementById('sec8-literatura').value,
            observacoes: document.getElementById('sec8-observacoes').value
          },
          treinamento_fisico: {
            atividades_realizadas: document.getElementById('sec9-atividades').value,
            instrutor_re: document.getElementById('sec9-instrutor-re').value,
            instrutor_nome: document.getElementById('sec9-instrutor-nome').value,
            observacoes: document.getElementById('sec9-observacoes').value
          }
        },
        manutencao: {
          limpeza: document.getElementById('sec10-limpeza').value,
          melhorias: document.getElementById('sec10-melhoria').value,
          medidor_energia: document.getElementById('sec10-energia').value,
          medidor_energia_unidade: document.getElementById('sec10-energia-unid').value,
          hidrometro: document.getElementById('sec10-hidrometro').value,
          hidrometro_unidade: document.getElementById('sec10-hidrometro-unid').value
        },
        ocorrencias: document.getElementById('sec11-ocorrencias').value,
        rondas: rondas
      };

      const saveRes = await rpc('apiSaveRegistro', regId, payload, STATE.token);

      if (saveRes.success) {
        preencherFormularioComRegistro(saveRes.registro);
        document.getElementById('form-save-indicator').innerText = 'Salvo com sucesso';
        showToast(isDraft ? 'Rascunho salvo com sucesso.' : 'Registro salvo e sincronizado na planilha.', 'success');
      } else {
        showToast(saveRes.message, 'error');
      }
    } catch (e) {
      showToast('Erro ao salvar registro: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  /**
   * Assinar Conferência Oficial
   */
  async function assinarConferencia(papelKey) {
    if (!STATE.currentRegistroId) {
      showToast('Grave o registro antes de assinar a conferência.', 'error');
      return;
    }

    const papelNomes = {
      cmt_sai: 'Comandante da Prontidão que Sai',
      cmt_entra: 'Comandante da Prontidão que Entra',
      cmt_pb: 'Comandante do Posto de Bombeiros'
    };

    if (!confirm(`Confirmar validação e aposição de visto oficial como ${papelNomes[papelKey]}?`)) {
      return;
    }

    showLoading(true);
    try {
      const res = await rpc('apiValidarConferencia', STATE.currentRegistroId, papelKey, STATE.token, '');
      if (res.success) {
        showToast(`Conferência assinada com sucesso!`, 'success');
        // Recarrega o registro
        await carregarRegistroPorId(STATE.currentRegistroId);
      } else {
        showToast(res.message, 'error');
      }
    } catch (e) {
      showToast('Falha na assinatura: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  /**
   * Finalizar Registro Oficialmente
   */
  async function finalizarRegistroAtual() {
    if (!confirm('Deseja finalizar oficialmente este Livro de Registro? Após a finalização, edições serão bloqueadas.')) {

      }
    } catch (e) {
      showToast('Erro ao finalizar: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  async function imprimirRegistroAtual() {

      return;

  async function imprimirRegistroPorId(registroId) {
    showLoading(true);
    try {
      const res = await rpc('apiGetRegistro', registroId, STATE.token);
      if (res.success && res.registro) {
        abrirModalImpressaoComDados(res.registro);
      } else {
        showToast('Não foi possível carregar o registro para impressão.', 'error');
      }
    } catch (e) {
      showToast('Falha ao preparar impressão: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  function abrirModalImpressaoComDados(reg) {
    const target = document.getElementById('conteudo-impressao-render');
    const template = document.getElementById('print-document');

    if (!target || !template) return;

    // Clona o documento de impressão para o modal
    target.innerHTML = template.outerHTML;
    const doc = target.querySelector('#print-document');
    doc.style.display = 'block';

    const h = reg.header;

    // Header Frente
    doc.querySelector('#p-header-gb').innerText = (h.grupamento ? h.grupamento.toUpperCase() : '15º GRUPAMENTO DE BOMBEIROS');
    doc.querySelector('#p-sgb').innerText = h.sgb || '-';
    doc.querySelector('#p-pb').innerText = h.pb_nome || '-';
    doc.querySelector('#p-servico-de').innerText = `${Utils.formatDateBR(h.data_inicio)} às ${h.hora_inicio}`;
    doc.querySelector('#p-servico-para').innerText = `${Utils.formatDateBR(h.data_termino)} às ${h.hora_termino}`;
    doc.querySelector('#p-prontidao').innerText = `PRONTIDÃO ${h.prontidao ? h.prontidao.toUpperCase() : '-'}`;
    doc.querySelector('#p-cmt-prontidao').innerText = `${h.cmt_graduacao || ''} ${h.cmt_re || ''} ${h.cmt_nome || ''}`.trim() || '-';

    // Seção 1
    const pes = reg.pessoal || {};
    doc.querySelector('#p-falta').innerText = pes.falta || 0;
    doc.querySelector('#p-baixas').innerText = pes.baixas || 0;
    doc.querySelector('#p-visitantes').innerText = pes.visitantes || 0;
    doc.querySelector('#p-licenca').innerText = pes.licenca_convalescenca || 0;
    doc.querySelector('#p-restricao').innerText = pes.restricao || 0;
    doc.querySelector('#p-estagiarios').innerText = pes.estagiarios || 0;
    // Seção 1: Complementos detalhados
    if (pes.complementos && pes.complementos.length > 0) {
      doc.querySelector('#p-pessoal-complemento').innerHTML = pes.complementos.map(c => `• [${c.categoria}] <strong>${c.militar_graduacao || ''} ${c.militar_re || ''} ${c.militar_nome || ''}</strong>${c.motivo ? ' — ' + c.motivo : ''}`).join('<br>') + (pes.complemento ? `<br><em>${pes.complemento}</em>` : '');
    } else {
      doc.querySelector('#p-pessoal-complemento').innerText = pes.complemento || 'Sem alterações';
    }

    // Seção 2
    const bel = reg.materiais_belicos || {};
    if (bel.armamentos && bel.armamentos.length > 0) {
      doc.querySelector('#p-col-armamento').innerHTML = bel.armamentos.map(a => `• ${a.tipo} ${a.modelo} ${a.marca} (Nº ${a.numero_serie})`).join('<br>');
    }
    if (bel.coletes && bel.coletes.length > 0) {
      doc.querySelector('#p-col-colete').innerHTML = bel.coletes.map(c => `• Tam: ${c.tamanho} (Qtd: ${c.quantidade}) Capas: ${c.capas} Série: ${c.numero_serie}`).join('<br>');
    }
    if (bel.municoes && bel.municoes.length > 0) {
      doc.querySelector('#p-col-municao').innerHTML = bel.municoes.map(m => `• ${m.tipo} (Qtd: ${m.quantidade})`).join('<br>');
    }
    doc.querySelector('#p-outros-belicos').innerText = bel.outros_materiais || 'Nenhum';

    // Seção 3
    doc.querySelector('#p-novidade-materiais').innerText = reg.novidades_materiais || 'Sem alterações.';

    // Seção 4: Viaturas com guarnição detalhada
    const vtr = reg.viaturas || { viaturas: [], totais: {} };
    const getVtrList = (sit) => {
      const list = (vtr.viaturas || []).filter(v => v.situacao === sit);
      if (list.length === 0) return '-';
      return list.map(v => {
        let det = `<strong>${v.prefixo}</strong>`;
        const guarn = [];
        if (v.comandante_nome) guarn.push(`Cmt: ${v.comandante_nome}`);
        if (v.motorista_nome) guarn.push(`Mot: ${v.motorista_nome}`);
        if (v.auxiliares && v.auxiliares.length > 0) {
          const auxList = v.auxiliares.map(a => a.display || a.nome || a.re).filter(Boolean);
          if (auxList.length > 0) guarn.push(`Aux: ${auxList.join(', ')}`);
        }
        if (guarn.length > 0) det += ` [${guarn.join(' | ')}]`;
        if (v.observacoes) det += ` (${v.observacoes})`;
        return det;
      }).join('<br>');
    };

    doc.querySelector('#p-vtr-operando-list').innerHTML = getVtrList('Operando');

  function renderTabelaUltimos(registros) {
    const tbody = document.getElementById('tbody-ultimos-registros');
    if (!tbody) return;

    if (!registros || registros.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">Nenhum registro encontrado.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    registros.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight: 700; color: #fff;">${r.numero_registro}</td>
        <td>${Utils.formatDateBR(r.data_inicio)} (${r.hora_inicio}) a ${Utils.formatDateBR(r.data_termino)} (${r.hora_termino})</td>
        <td><span class="badge-prontidao badge-prontidao-${r.prontidao ? r.prontidao.toLowerCase() : 'verde'}">${r.prontidao}</span></td>
        <td>${r.sgb} • ${r.pb_nome}</td>
        <td>${r.cmt_graduacao || ''} ${r.cmt_re || ''} ${r.cmt_nome || ''}</td>
        <td><span class="status-badge badge-${r.status.toLowerCase().replace(/\s+/g, '-')}">${r.status}</span></td>
        <td style="text-align: right; white-space: nowrap;">
          <button class="btn btn-secondary btn-sm" onclick="App.carregarRegistroPorId('${r.id}')">Abrir</button>
          <button class="btn btn-secondary btn-sm" onclick="App.imprimirRegistroPorId('${r.id}')">🖨️</button>

      `;

  async function executarPesquisaConsulta(page = 1) {
    const filters = {
      numero_registro: document.getElementById('filtro-numero').value,
      data_inicio: document.getElementById('filtro-data-ini').value,
      data_fim: document.getElementById('filtro-data-fim').value,
      prontidao: document.getElementById('filtro-prontidao').value,
      sgb: document.getElementById('filtro-sgb').value,
      pb_id: document.getElementById('filtro-pb').value,
      status: document.getElementById('filtro-status').value,
      page: page,
      pageSize: 15
    };

    showLoading(true);
    try {
      const res = await rpc('apiQueryRegistros', filters, STATE.token);
      if (res.success && res.data) {
        renderTabelaConsulta(res.data);
      }
    } catch (e) {
      showToast('Falha na consulta: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  function renderTabelaConsulta(data) {
    const tbody = document.getElementById('tbody-consulta-registros');
    document.getElementById('consulta-total-display').innerText = `${data.total} registros encontrados`;
    document.getElementById('paginacao-info').innerText = `Página ${data.page} de ${data.totalPages || 1}`;

    if (!data.items || data.items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2.5rem;">Nenhum registro encontrado para os filtros selecionados.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    data.items.forEach(r => {
      const tr = document.createElement('tr');
      const podeCancelar = STATE.user && STATE.user.perfil === 'admin' && r.status !== 'Cancelado';

      tr.innerHTML = `
        <td style="font-weight: 700; color: #fff;">${r.numero_registro}</td>
        <td>${Utils.formatDateBR(r.data_inicio)} (${r.hora_inicio}) a ${Utils.formatDateBR(r.data_termino)} (${r.hora_termino})</td>
        <td><span class="badge-prontidao badge-prontidao-${r.prontidao ? r.prontidao.toLowerCase() : 'verde'}">${r.prontidao}</span></td>
        <td>${r.sgb} • ${r.pb_nome}</td>
        <td>${r.cmt_graduacao || ''} ${r.cmt_re || ''} ${r.cmt_nome || ''}</td>
        <td><span class="status-badge badge-${r.status.toLowerCase().replace(/\s+/g, '-')}">${r.status}</span></td>
        <td style="font-size: 0.8rem; color: var(--text-muted);">${r.atualizado_em ? new Date(r.atualizado_em).toLocaleString('pt-BR') : '-'}</td>
        <td style="text-align: right; white-space: nowrap;">
          <button class="btn btn-secondary btn-sm" onclick="App.carregarRegistroPorId('${r.id}')">Visualizar</button>
          <button class="btn btn-secondary btn-sm" onclick="App.imprimirRegistroPorId('${r.id}')">🖨️</button>
          ${podeCancelar ? `<button class="btn btn-danger btn-sm" onclick="App.abrirModalCancelar('${r.id}')">Cancelar</button>` : ''}
        </td>
      `;
      tbody.appendChild(tr);
    });

    // Renderiza botões de paginação
    const bts = document.getElementById('paginacao-botoes');
    bts.innerHTML = '';
    if (data.page > 1) {
      const prev = document.createElement('button');
      prev.className = 'btn btn-secondary btn-sm';
      prev.innerText = '← Anterior';
      prev.onclick = () => executarPesquisaConsulta(data.page - 1);
      bts.appendChild(prev);
    }
    if (data.page < data.totalPages) {
      const next = document.createElement('button');
      next.className = 'btn btn-secondary btn-sm';
      next.innerText = 'Próxima →';
      next.onclick = () => executarPesquisaConsulta(data.page + 1);
      bts.appendChild(next);
    }
  }

  function limparFiltrosConsulta() {
    document.getElementById('filtro-numero').value = '';
    document.getElementById('filtro-data-ini').value = '';
    document.getElementById('filtro-data-fim').value = '';
    document.getElementById('filtro-prontidao').value = '';
    document.getElementById('filtro-sgb').value = '';
    document.getElementById('filtro-pb').value = '';
    document.getElementById('filtro-status').value = '';
    executarPesquisaConsulta(1);

  async function confirmarCancelamentoRegistro() {
    const id = document.getElementById('cancelar-registro-id').value;
    const motivo = document.getElementById('cancelar-motivo').value.trim();

    if (!motivo || motivo.length < 5) {
      showToast('Informe uma justificativa técnica de cancelamento.', 'error');
      return;
    }

    showLoading(true);
    try {
      const res = await rpc('apiCancelarRegistro', id, motivo, STATE.token);
      if (res.success) {
        showToast('Registro cancelado com sucesso.', 'success');
        fecharModal('modal-cancelar-registro');
        executarPesquisaConsulta(1);
      } else {
        showToast(res.message, 'error');
      }
    } catch (e) {
      showToast('Falha ao cancelar: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

    }
  }

  function abrirModalPosto() {
    document.getElementById('modal-pb-id').value = '';
    document.getElementById('modal-pb-nome').value = '';
    document.getElementById('modal-pb-sigla').value = '';
    document.getElementById('modal-pb-municipio').value = '';
    document.getElementById('modal-posto-titulo').innerText = 'Cadastrar Posto de Bombeiros';
    abrirModal('modal-posto');
  }

  function editarPostoModal(p) {
    document.getElementById('modal-pb-id').value = p.id;
    document.getElementById('modal-pb-nome').value = p.nome;
    document.getElementById('modal-pb-sigla').value = p.sigla || '';
    document.getElementById('modal-pb-sgb').value = p.sgb;
    document.getElementById('modal-pb-municipio').value = p.municipio || '';
    document.getElementById('modal-posto-titulo').innerText = `Editar Posto: ${p.sigla}`;
    abrirModal('modal-posto');
  }

  async function salvarPostoModal() {
    const data = {
      id: document.getElementById('modal-pb-id').value,
      nome: document.getElementById('modal-pb-nome').value,
      sigla: document.getElementById('modal-pb-sigla').value,
      sgb: document.getElementById('modal-pb-sgb').value,
      grupamento_id: document.getElementById('modal-pb-gb').value,
      municipio: document.getElementById('modal-pb-municipio').value,
      ativo: true
    };

    showLoading(true);
    try {
      const res = await rpc('apiSavePosto', data, STATE.token);
      if (res.success) {
        showToast('Posto gravado com sucesso.', 'success');
        fecharModal('modal-posto');
        carregarAdminPostos();
        await carregarDadosIniciais();
      } else {
        showToast(res.message, 'error');
      }
    } catch (e) {
      showToast('Erro ao salvar posto: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  async function carregarAuditLogs() {
    try {
      const res = await rpc('apiGetAuditLogs', { limit: 100 }, STATE.token);
      const tbody = document.getElementById('tbody-admin-auditoria');
      if (res.success && res.logs) {
        tbody.innerHTML = '';
        res.logs.forEach(l => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-size: 0.8rem; color: var(--text-muted);">${new Date(l.timestamp).toLocaleString('pt-BR')}</td>
            <td><strong>${l.usuario_re}</strong> (${l.usuario_nome})</td>
            <td><span class="status-badge" style="background: rgba(255,255,255,0.08);">${l.acao}</span></td>
            <td>${l.entidade}</td>
            <td><span class="status-badge ${l.resultado === 'SUCESSO' ? 'badge-finalizado' : 'badge-cancelado'}">${l.resultado}</span></td>
            <td style="font-size: 0.82rem; color: var(--text-secondary);">${l.detalhes}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function exportarBackup() {
    showLoading(true);
    try {
      const res = await rpc('apiGetFullBackup', STATE.token);
      if (res.success && res.backup) {
        const jsonStr = JSON.stringify(res.backup, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_livro_registro_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Backup exportado com sucesso.', 'success');
      }
    } catch (e) {
      showToast('Falha ao exportar backup: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  async function executarBootstrapAutorizado() {
    if (!confirm('Deseja executar a verificação e inicialização dos esquemas de banco de dados da planilha? Operação não destrutiva.')) {
      return;
    }
    showLoading(true);
    try {
      const res = await rpc('apiBootstrapSystem');
      if (res.success) {
        showToast(res.message, 'success');
      } else {
        showToast(res.message, 'error');
      }
    } catch (e) {
      showToast('Erro no bootstrap: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  async function sincronizarEfetivoSisFolgas() {
    if (!confirm('Deseja sincronizar a base de militares com a planilha do SisFolgas? Novos militares serão cadastrados e existentes serão atualizados.')) {
      return;
    }
    showLoading(true);
    try {
      const res = await rpc('apiSyncEfetivoSisFolgas', STATE.token);
      if (res.success) {
        showToast(res.message, 'success');
        carregarAdminMilitares();
      } else {
        showToast(res.message, 'error');
      }
    } catch (e) {
      showToast('Erro na sincronização: ' + (e.message || e), 'error');
    } finally {
      showLoading(false);
    }
  }

  // Executa na inicialização do DOM
  window.addEventListener('DOMContentLoaded', init);

  return {
    init: init,
    fazerLogin: fazerLogin,
    fazerLogout: fazerLogout,
    salvarTrocaSenha: salvarTrocaSenha,
    navegarPara: navegarPara,
    togglePasswordVisibility: togglePasswordVisibility,
    abrirModal: abrirModal,
    fecharModal: fecharModal,
    abrirNovoRegistro: abrirNovoRegistro,
    voltarDoFormulario: voltarDoFormulario,
    carregarRegistroPorId: carregarRegistroPorId,
    salvarRegistroForm: salvarRegistroForm,
    assinarConferencia: assinarConferencia,
    finalizarRegistroAtual: finalizarRegistroAtual,
    imprimirRegistroAtual: imprimirRegistroAtual,
    imprimirRegistroPorId: imprimirRegistroPorId,
    executarImpressaoNavegador: executarImpressaoNavegador,
    carregarDashboard: carregarDashboard,
    executarPesquisaConsulta: executarPesquisaConsulta,
    limparFiltrosConsulta: limparFiltrosConsulta,
    abrirModalCancelar: abrirModalCancelar,
    confirmarCancelamentoRegistro: confirmarCancelamentoRegistro,
    onDataInicioChange: onDataInicioChange,
    onProntidaoManualChange: onProntidaoManualChange,
    onSgbChange: onSgbChange,
    onGrupamentoChange: onGrupamentoChange,
    buscarComandanteAutocomplete: buscarComandanteAutocomplete,
    buscarInstrutorSec7: buscarInstrutorSec7,
    buscarInstrutorSec8: buscarInstrutorSec8,
    buscarInstrutorSec9: buscarInstrutorSec9,
    buscarNomeRonda: buscarNomeRonda,
    buscarMilitarComplemento: buscarMilitarComplemento,
    incluirComplemento: incluirComplemento,
    removerComplemento: removerComplemento,
    abrirModalCatalogoMaterial: abrirModalCatalogoMaterial,
    salvarMaterialCatalogoModal: salvarMaterialCatalogoModal,
    adicionarCardViatura: adicionarCardViatura,
    adicionarAuxiliarViatura: adicionarAuxiliarViatura,
    removerAuxiliarViatura: removerAuxiliarViatura,
    removerViaturaCard: removerViaturaCard,
    adicionarViaturaManual: adicionarViaturaManual,
    buscarMilitarGuarnicao: buscarMilitarGuarnicao,
    abrirModalMilitarRapido: abrirModalMilitarRapido,
    salvarMilitarRapidoModal: salvarMilitarRapidoModal,
    buscarAutoridadeConf: buscarAutoridadeConf,
    sincronizarEfetivoSisFolgas: sincronizarEfetivoSisFolgas,
    toggleAccordion: toggleAccordion,
    adicionarArmamento: adicionarArmamento,
    adicionarColete: adicionarColete,
    adicionarMunicao: adicionarMunicao,
    adicionarViatura: adicionarViatura,
    atualizarTotaisViaturas: atualizarTotaisViaturas,
    adicionarRonda: adicionarRonda,
    abrirAdminSubTab: abrirAdminSubTab,
    abrirModalMilitar: abrirModalMilitar,
    editarMilitarModal: editarMilitarModal,
    salvarMilitarModal: salvarMilitarModal,
    resetarSenhaUsuario: resetarSenhaUsuario,
    desbloquearUsuario: desbloquearUsuario,
    abrirModalPosto: abrirModalPosto,
    editarPostoModal: editarPostoModal,
    salvarPostoModal: salvarPostoModal,
    carregarAuditLogs: carregarAuditLogs,
    exportarBackup: exportarBackup,
    executarBootstrapAutorizado: executarBootstrapAutorizado
  };
})();
</script>
